[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "wirerope"
version = "1.0.0"
description = "Turn functions and methods into fully controllable objects"
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "BSD-2-Clause"}
authors = [
    {name = "Jeong, YunWon", email = "wirerope@youknowone.org"}
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "six>=1.11.0",
]

[project.optional-dependencies]
test = [
    "pytest>=4.6.7",
    "pytest-cov>=2.6.1",
    "pytest-checkdocs>=1.2.5;python_version<'3'",
    "pytest-checkdocs>=2.9.0;python_version>='3'",
    "pytest-benchmark>=3.2.0",
]
doc = [
    "sphinx",
]

[project.urls]
Homepage = "https://github.com/youknowone/wirerope"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "wirerope._wirerope_rust"

